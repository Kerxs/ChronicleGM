[package]
name = "chronicle-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chronicle-rules = { version = "0.0.2", path = "../rules" }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
ulid = "3.0.0"
base64 = "0.23.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

