[package]
name = "chronicle-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chronicle-core = { version = "0.0.5", path = "../core" }
chronicle-llm = { version = "0.0.5", path = "../llm" }
minijinja = { version = "3.1.0", features = ["serde"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"

