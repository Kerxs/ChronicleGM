[package]
name = "chronicle-gm"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chronicle-core = { version = "0.0.1", path = "../core" }
chronicle-gen = { version = "0.0.1", path = "../gen" }
chronicle-llm = { version = "0.0.1", path = "../llm" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
chronicle-runtime = { version = "0.0.1", path = "../runtime" }
tempfile = "3.27.0"

