[package]
name = "chronicle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chronicle-server"
path = "src/main.rs"

[dependencies]
chronicle-protocol = { path = "../protocol" }
chronicle-core = { path = "../core" }
chronicle-llm = { path = "../llm" }
chronicle-gm = { path = "../gm" }
chronicle-gen = { path = "../gen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
futures-util = "0.3.34"
# GM Agent 主动连出服务端（wss 用系统自带的 TLS：Windows SChannel / Linux OpenSSL）。
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
ulid = "3.0.0"
axum = { version = "0.8.9", features = ["ws"] }
sha2 = "0.10.9"
getrandom = "0.2.17"
hex = "0.4.3"

[dev-dependencies]
ureq = "3.5.2"
tempfile = "3.27.0"
