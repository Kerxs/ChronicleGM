# /etc/nginx/sites-available/chronicle-7780  —— 还没有域名时的测试配置：用 IP:7780 访问（明文 HTTP，只适合测试）。
# 有了域名后换成 nginx-chronicle.conf（HTTPS）。不影响同一台机器上的其他站点。

limit_req_zone  $binary_remote_addr zone=chron_http:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=chron_conn:10m;

map $http_upgrade $chron_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7780;
    listen [::]:7780;
    server_name _;
    client_max_body_size 64k;
    limit_conn chron_conn 20;

    location = /ws {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chron_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /agent {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chron_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }

    location = /rooms {
        limit_req zone=chron_http burst=5 nodelay;
        proxy_pass http://127.0.0.1:7788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health { proxy_pass http://127.0.0.1:7788; }
    location / { return 404; }
}
