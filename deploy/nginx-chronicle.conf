# /etc/nginx/sites-available/chronicle  （把 chronicle.example.com 换成你的域名，证书用 certbot 申请）
# 只有 Nginx 对公网开放 80/443；chronicle-server 只监听 127.0.0.1:7788。

limit_req_zone  $binary_remote_addr zone=chron_http:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=chron_conn:10m;

map $http_upgrade $chron_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chronicle.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chronicle.example.com;

    ssl_certificate     /etc/letsencrypt/live/chronicle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronicle.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    limit_conn chron_conn 20;

    # 玩家连接
    location = /ws {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chron_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 房主电脑上的 GM Agent 主动连进来（模型输出比玩家消息大）
    location = /agent {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chron_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }

    # 建房（需要管理员令牌，服务端校验）
    location = /rooms {
        limit_req zone=chron_http burst=5 nodelay;
        proxy_pass http://127.0.0.1:7788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:7788;
    }

    location / { return 404; }
}
