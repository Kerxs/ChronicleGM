[package]
name = "chronicle-gm-app"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
chronicle-core = { version = "0.0.1", path = "../crates/core" }
chronicle-gen = { version = "0.0.1", path = "../crates/gen" }
chronicle-gm = { version = "0.0.1", path = "../crates/gm" }
chronicle-llm = { version = "0.0.1", path = "../crates/llm" }
chronicle-runtime = { version = "0.0.1", path = "../crates/runtime" }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
