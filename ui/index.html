<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle GM</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <style>
      /* 启动动画：内联在页面里，脚本加载前就能显示；界面准备好后由 main.tsx 淡出。 */
      html, body { margin: 0; height: 100%; background: #f5f5f7; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(1200px 700px at 50% 38%, #ffffff 0%, #eef3fb 55%, #e6ecf6 100%);
        font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        transition: opacity 0.55s ease, transform 0.55s ease, filter 0.55s ease;
        -webkit-app-region: drag;
      }
      #splash.done { opacity: 0; transform: scale(1.04); filter: blur(6px); pointer-events: none; }
      #splash .orb { position: relative; width: 112px; height: 112px; }
      #splash .blob { position: absolute; inset: -40px; border-radius: 50%; filter: blur(26px); opacity: 0; animation: sp-blob 1.4s ease-out 0.1s forwards, sp-spin 9s linear infinite;
        background: conic-gradient(from 0deg, #5ac8fa, #007aff, #af52de, #ff6fb1, #5ac8fa); }
      #splash .ball { position: absolute; inset: 0; width: 112px; height: 112px; border-radius: 28px; transform: scale(0.2); opacity: 0;
        box-shadow: 0 18px 44px rgba(40, 60, 160, 0.28); animation: sp-pop 0.9s cubic-bezier(.2,1.4,.4,1) 0.15s forwards; }
      #splash svg { position: absolute; inset: -22px; width: 156px; height: 156px; transform: rotate(-90deg); }
      #splash circle { fill: none; stroke: #007aff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 402; stroke-dashoffset: 402; opacity: 0.85;
        animation: sp-draw 1.3s cubic-bezier(.6,0,.2,1) 0.35s forwards, sp-ring 1.6s linear 1.65s infinite; transform-origin: 70px 70px; }
      #splash .name { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; color: #1d1d1f; opacity: 0; transform: translateY(8px); animation: sp-up 0.7s ease 0.7s forwards; }
      #splash .sub { margin-top: -14px; font-size: 13px; letter-spacing: 6px; color: #86868b; opacity: 0; transform: translateY(8px); animation: sp-up 0.7s ease 0.9s forwards; }
      @keyframes sp-pop { to { transform: scale(1); opacity: 1; } }
      @keyframes sp-blob { to { opacity: 0.55; } }
      @keyframes sp-spin { to { rotate: 360deg; } }
      @keyframes sp-draw { 0% { stroke-dashoffset: 402; } 100% { stroke-dashoffset: 300; } }
      @keyframes sp-ring { to { transform: rotate(360deg); } }
      @keyframes sp-up { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="正在启动">
      <div class="orb"><div class="blob"></div><img class="ball" src="/app-icon.png" alt="" /><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="66" /></svg></div>
      <div class="name">Chronicle GM</div>
      <div class="sub">编年史主持人</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
